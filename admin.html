<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike - Ajoute ak Jere Pwodui</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-screen admin-screen">
        <div class="detail-header">
            <button class="icon-btn" onclick="location.href='catalog.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h3 style="font-weight: 800; font-size: 16px;">Jere Pwodui</h3>
            <div style="width: 48px;"></div>
        </div>

        <form id="addProductForm" class="admin-form">
            <!-- 1. ADD FOTO (KATANGL AK PLUS) -->
            <div class="form-group">
                <label>Foto Pwodwi</label>
                <div class="image-upload-box" onclick="document.getElementById('product-image').click()">
                    <div class="upload-icon-wrapper">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <span>Ajoute foto</span>
                    <input type="file" id="product-image" accept="image/*" multiple style="display: none;" onchange="previewImage(event)">
                </div>
                <div id="image-preview-container" class="image-preview-container"></div>
            </div>

            <!-- Non Pwodwi -->
            <div class="form-group">
                <label>Non Pwodwi an</label>
                <input type="text" id="prodName" placeholder="ex: Nike Air Force 1" required>
            </div>

            <!-- Pri -->
            <div class="form-group">
                <label>Pri ($USD)</label>
                <input type="number" id="prodPrice" placeholder="ex: 200" required>
            </div>

            <!-- 2. SIZE (MANUYÈL) -->
            <div class="form-group">
                <label>Gwosè / Size (Ekri yo, separe ak konma)</label>
                <input type="text" id="prodSizes" placeholder="ex: S, M, L, XL oswa 40, 41, 42" required>
            </div>

            <!-- Koulè -->
            <div class="form-group">
                <label>Koulè (Mete kòd HEX oswa non angle: #1A1A1A, red)</label>
                <input type="text" id="prodColors" placeholder="#1A1A1A, #EF4444, #3B82F6" required>
            </div>

            <!-- 3. KATEGORI AN POP-UP -->
            <div class="form-group">
                <label>Kategori</label>
                <div class="category-select-btn" onclick="openCategoryModal()">
                    <span id="selected-category-text">Chwazi yon kategori...</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
                <input type="hidden" id="prodCategory" value="Sneakers / Soulye">
            </div>

            <button type="submit" class="btn-get-started" style="margin-top: 15px; justify-content: center;">
                Anregistre Pwodui a
            </button>
        </form>

        <!-- SEKSYON POU EFASER / REMOVE PWODUI YO -->
        <div class="admin-manage-section">
            <h4 style="margin: 25px 0 15px 0; font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--text-gray);">Lis Pwodui (Siprime)</h4>
            <div id="adminProductList" class="admin-product-list">
                <!-- Pwodui yo ap parèt isit la ak yon bouton siprime -->
            </div>
        </div>
    </div>

    <!-- MODAL / POP-UP POU KATEGORI -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chwazi Kategori</h3>
                <span class="close-btn" onclick="closeCategoryModal()">&times;</span>
            </div>
            <div class="category-options-list">
                <div class="cat-option" onclick="selectCategory('Sneakers / Soulye')">
                    <i class="fa-solid fa-shoe-prints"></i> Sneakers / Soulye
                </div>
                <div class="cat-option" onclick="selectCategory('Rad / Vêtements')">
                    <i class="fa-solid fa-shirt"></i> Rad / Vêtements
                </div>
                <div class="cat-option" onclick="selectCategory('Akseswa')">
                    <i class="fa-solid fa-glasses"></i> Akseswa
                </div>
                <div class="cat-option" onclick="selectCategory('Lòt Bagay')">
                    <i class="fa-solid fa-box"></i> Lòt Bagay
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
