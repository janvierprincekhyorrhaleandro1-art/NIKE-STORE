<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findora - Autentifikasyon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-screen">
        <div class="auth-container">
            
            <!-- HEADER -->
            <div class="auth-header">
                <button class="btn-back" onclick="location.href='index.html'">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div style="width: 44px;"></div>
            </div>

           <!-- KÒD POU W METE A -->
<div class="auth-brand">
    <div class="auth-logo-badge">
        <span style="font-size: 26px; font-weight: 900; color: #FFFFFF;">H</span>
    </div>
    <h2 id="authHeading">Bienvenue sur Findora</h2>
                <p id="authSubheading">Konekte pou w jwenn kay ideyal ou a</p>
            </div>

            <!-- TAB SWITCHER -->
            <div class="tab-switcher">
                <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="tabSignupBtn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- MESAJ ERÈ -->
            <div class="error-message" id="errorMessage"></div>

            <!-- FORM 1: LOGIN -->
            <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email oswa Telefòn</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="text" id="loginEmail" placeholder="eg: user@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                    </div>
                </div>

                <div class="form-options">
                    <div></div>
                    <a href="#" class="forgot-link" onclick="alert('Fonksyon sa ap disponib nan pwochen mizajou a!')">Mote de pas oubliyé?</a>
                </div>

                <button type="submit" class="btn-submit">Se Connecter</button>
            </form>

            <!-- FORM 2: SIGN UP -->
            <form id="signupForm" class="auth-form hidden" onsubmit="handleSignUp(event)">
                <div class="input-group">
                    <label>Nom Complet</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user field-icon"></i>
                        <input type="text" id="signupName" placeholder="eg: Jean Baptiste" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Adresse Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="email" id="signupEmail" placeholder="eg: user@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="signupPassword" placeholder="Lomwen 6 karaktè" required minlength="6">
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('signupPassword', this)"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirmer Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved field-icon"></i>
                        <input type="password" id="signupConfirmPassword" placeholder="Reantre menm modpas la" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Créer un Compte</button>
            </form>

            <!-- LINK ENVITE -->
            <div class="guest-link-wrapper">
                <a href="catalog.html">Kontinye kòm Envite</a>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
