<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike - Catalog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-screen catalog-screen">
        <div class="header-search">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass" style="color: #A0A0A0;"></i>
                <input type="text" placeholder="Search product..." id="searchInput" oninput="handleSearch()">
            </div>
            <button class="icon-btn" onclick="openCategoryModal()"><i class="fa-solid fa-layer-group"></i></button>
            <button class="icon-btn" onclick="openCategoryModal()"><i class="fa-solid fa-sliders"></i></button>
        </div>

        <!-- NEW COLLECTION CARD (DYNAMIK) -->
        <div class="featured-card" id="featuredCardContainer">
            <!-- Injecter ak JavaScript -->
        </div>

        <!-- PRODUCT GRID -->
        <div class="product-grid" id="catalogProductGrid">
            <!-- Injecter ak JavaScript -->
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <a href="catalog.html" class="nav-link active"><i class="fa-solid fa-house"></i></a>
            <a href="cart.html" class="nav-link"><i class="fa-solid fa-bag-shopping"></i></a>
            <a href="favorite.html" class="nav-link"><i class="fa-regular fa-heart"></i></a>
            <a href="profil.html" class="nav-link"><i class="fa-regular fa-user"></i></a>
        </div>
    </div>

    <!-- MODAL CATEGORIES -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Kategori Yo</h3>
                <span class="close-btn" onclick="closeCategoryModal()">&times;</span>
            </div>
            <div class="category-options-list" id="catalogCategoryList">
                <!-- Dynamique -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
