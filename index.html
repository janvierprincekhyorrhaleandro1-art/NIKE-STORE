<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-body">

  <div class="app-card">
    <!-- Hero Image Area -->
    <div class="hero-section">
      <img id="display-hero" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Hero Banner">
      <div class="logo-overlay">
        <div class="logo-icon-wrap">
          <img id="display-logo" src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Logo">
        </div>
        <h2 id="display-brand-name">FINDORA</h2>
        <p id="display-brand-tag">Dream House</p>
      </div>
    </div>

    <!-- Bottom Content Sheet -->
    <div class="content-sheet">
      <h1 id="display-title">WELCOME</h1>
      <p id="display-subtitle">Find your next space, feel at home.<br>Where comfort meets convenience.</p>

      <div class="button-group">
        <button class="btn btn-dark" onclick="alert('Login Clicked')">Login</button>
        <button class="btn btn-outline" onclick="alert('Sign Up Clicked')">Sign Up</button>
        <a href="catalog.html" class="btn btn-guest">Continue as Guest (Shop)</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
